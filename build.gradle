plugins {
    id 'java-library'
}

group = 'com.lemurguiinspector'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}


wrapper {
  gradleVersion = '8.14'
}

repositories {
    mavenCentral()
}

dependencies {
    api 'org.jmonkeyengine:jme3-core:3.9.0-stable'
    api 'com.simsilica:lemur:1.16.0'

    // AWTLoader for the bundled default font image; needed by the headless tests
    testImplementation 'org.jmonkeyengine:jme3-desktop:3.9.0-stable'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}
